<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 48" role="img" aria-label="Divider"><title>Twig divider</title><defs><linearGradient id="td-g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8BD450"/><stop offset="1" stop-color="#2E8B2E"/></linearGradient></defs><style>
.t{fill:none;stroke:#A9702F;stroke-width:4;stroke-linecap:round;stroke-dasharray:1;animation:d 1.4s ease-out backwards}
@keyframes d{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes s{from{transform:scale(0)}to{transform:scale(1)}}
.l{transform-box:fill-box;transform-origin:0 100%;animation:s .5s ease-out backwards}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<path class="t" pathLength="1" d="M8 28C90 12 150 40 240 26S400 14 480 28 580 38 632 20"/>
<g class="l" style="animation-delay:.5s" transform="translate(150 31)"><path d="M0 0C6-12 22-16 34-12 31 0 16 8 0 0z" fill="url(#td-g)"/></g>
<g class="l" style="animation-delay:.8s" transform="translate(330 20) scale(-1 1) rotate(-12)"><path d="M0 0C6-12 22-16 34-12 31 0 16 8 0 0z" fill="url(#td-g)"/></g>
<g class="l" style="animation-delay:1.1s" transform="translate(500 28)"><path d="M0 0C6-12 22-16 34-12 31 0 16 8 0 0z" fill="url(#td-g)"/></g></svg>
