<svg xmlns="http://www.w3.org/2000/svg" viewBox="470 110 84 84" role="img" aria-label="Care"><title>Care heartbeat</title><defs><linearGradient id="ht-g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFA24D"/><stop offset="1" stop-color="#D9600F"/></linearGradient></defs><style>.heart-in{transform-box:fill-box;transform-origin:50% 70%;animation:beat 1.8s ease-in-out infinite}@keyframes beat{0%,100%{transform:scale(1)}10%{transform:scale(1.25)}20%{transform:scale(1)}30%{transform:scale(1.15)}42%{transform:scale(1)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><g id="ht"><g transform="translate(512 160)"><g class="heart-in"><path d="M0 22 C-30 2 -36 -20 -20 -30 C-9 -36 0 -29 0 -22 C0 -29 9 -36 20 -30 C36 -20 30 2 0 22 Z" fill="url(#ht-g)"/></g></g></g></svg>
