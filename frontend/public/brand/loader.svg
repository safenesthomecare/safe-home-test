<svg xmlns="http://www.w3.org/2000/svg" viewBox="262 104 500 400" role="img" aria-label="SafeNest loader" ><title>SafeNest loader</title><defs><linearGradient id="nb-g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#A9702F"/><stop offset="1" stop-color="#5A3213"/></linearGradient><linearGradient id="fb-g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3D9BE0"/><stop offset="1" stop-color="#004A82"/></linearGradient><linearGradient id="fo-g" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFA24D"/><stop offset="1" stop-color="#D9600F"/></linearGradient><linearGradient id="hs-b" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3D9BE0"/><stop offset="1" stop-color="#004A82"/></linearGradient><linearGradient id="hs-r" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFA24D"/><stop offset="1" stop-color="#D9600F"/></linearGradient><radialGradient id="gl-g"><stop offset="0" stop-color="#FFE59A" stop-opacity=".85"/><stop offset=".55" stop-color="#FFC83D" stop-opacity=".25"/><stop offset="1" stop-color="#FFC83D" stop-opacity="0"/></radialGradient><linearGradient id="nf-g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#A9702F"/><stop offset="1" stop-color="#5A3213"/></linearGradient><linearGradient id="nf-f" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8C5524"/><stop offset="1" stop-color="#5A3213"/></linearGradient><linearGradient id="ll-g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8BD450"/><stop offset="1" stop-color="#2E8B2E"/></linearGradient><linearGradient id="lr-g" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8BD450"/><stop offset="1" stop-color="#2E8B2E"/></linearGradient><linearGradient id="ht-g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFA24D"/><stop offset="1" stop-color="#D9600F"/></linearGradient></defs><style>
:root{--t0:0s}
.L-fb,.L-fo,.L-ll,.L-lr,.L-ht,.L-gl,.L-hs,.L-nf,.L-nb,.L-wm{transform-box:fill-box}
@keyframes beat{0%,100%{transform:scale(1)}10%{transform:scale(1.22)}20%{transform:scale(1)}30%{transform:scale(1.14)}42%{transform:scale(1)}}
@keyframes flicker{0%,100%{opacity:1}50%{opacity:.5}}
@keyframes sway{0%,100%{transform:rotate(0)}50%{transform:rotate(5deg)}}
@keyframes lean-l{0%,100%{transform:rotate(0)}50%{transform:rotate(2.5deg)}}
@keyframes lean-r{0%,100%{transform:rotate(0)}50%{transform:rotate(-2.5deg)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.heart-in{transform-box:fill-box;transform-origin:50% 70%;animation:beat 1.6s ease-in-out infinite,float 1.6s ease-in-out infinite}
.glow{animation:flicker 1.8s ease-in-out infinite}
.leaf-in{transform-box:fill-box;transform-origin:0 66%;animation:sway 2.4s ease-in-out infinite;animation-delay:var(--d,0s)}
.L-fb{transform-origin:80% 100%;animation:lean-l 3.2s ease-in-out infinite}
.L-fo{transform-origin:20% 100%;animation:lean-r 3.2s ease-in-out infinite}
.L-hs{animation:bob 1.8s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
