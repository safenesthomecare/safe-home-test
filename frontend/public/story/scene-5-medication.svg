<rect x="-30" y="580" width="26" height="30" rx="8" fill="#003B66"/><rect x="4" y="580" width="26" height="30" rx="8" fill="#003B66"/>
<circle cx="0" cy="334" r="36" fill="#8D5A3C"/><path d="M-36 330Q0 280 36 330Q12 312 -36 330Z" fill="#232323"/>
<path class="cur" d="M-24 405L-130 385" stroke="#0066B3" stroke-width="14" stroke-linecap="round"/></g></g>
<g id="layer-check" data-depth="0.9" transform="translate(600 250)"><circle class="halo" r="90" fill="url(#g5)"/>
<circle class="tick" r="38" fill="#4CAF3B"/><path class="tick" d="M-18 2l12 14 24-28" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/></g>
</svg>
