<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="t5 d5">
<title id="t5">Medication Reminder, 11:30 AM</title>
<desc id="d5">A caregiver hands a resident a glass of water beside a weekly pill organiser. A green check mark glows to show the dose is done on time.</desc>
<defs>
<linearGradient id="w5" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E6F1FA"/><stop offset="1" stop-color="#FFF9F2"/></linearGradient>
<radialGradient id="g5"><stop offset="0" stop-color="#8BD450" stop-opacity=".55"/><stop offset="1" stop-color="#4CAF3B" stop-opacity="0"/></radialGradient>
<style>
.tick{transform-box:fill-box;transform-origin:center;animation:pop 3.5s ease-in-out infinite}
.halo{animation:halo 3.5s ease-in-out infinite}
.cur{animation:pill 3.5s ease-in-out infinite}
@keyframes pop{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@keyframes halo{50%{opacity:.4}}
@keyframes pill{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@media (prefers-reduced-motion:reduce){.tick,.halo,.cur{animation:none}}
</style>
</defs>
<g id="layer-wall" data-depth="0.2"><rect width="1200" height="700" fill="url(#w5)"/>
<rect y="540" width="1200" height="160" fill="#F4E9DC"/><rect y="535" width="1200" height="8" fill="#E8DDD0"/>
<rect x="120" y="110" width="190" height="140" rx="10" fill="#FFD9B0" stroke="#FFF9F2" stroke-width="10"/><path d="M215 110v140M120 180h190" stroke="#FFF9F2" stroke-width="6"/>
<g transform="translate(900 100)"><rect width="150" height="130" rx="8" fill="#FFF9F2" stroke="#7B4A1E" stroke-width="8"/><path d="M20 105l40-45 30 30 20-20 25 35z" fill="#4CAF3B"/><circle cx="105" cy="38" r="14" fill="#FFC83D"/></g></g>
<g id="layer-furniture" data-depth="0.6">
<rect x="380" y="430" width="440" height="26" rx="8" fill="#A9702F"/><rect x="410" y="456" width="22" height="130" fill="#7B4A1E"/><rect x="770" y="456" width="22" height="130" fill="#7B4A1E"/>
<g transform="translate(450 392)"><rect width="190" height="38" rx="8" fill="#FFF9F2" stroke="#0066B3" stroke-width="3"/>
<g fill="#E6F1FA" stroke="#0066B3" stroke-width="2"><rect x="6" y="6" width="22" height="26" rx="4"/><rect x="32" y="6" width="22" height="26" rx="4"/><rect x="58" y="6" width="22" height="26" rx="4"/><rect x="84" y="6" width="22" height="26" rx="4"/><rect x="110" y="6" width="22" height="26" rx="4"/><rect x="136" y="6" width="22" height="26" rx="4"/><rect x="162" y="6" width="22" height="26" rx="4"/></g>
<g fill="#F47A1F"><circle cx="17" cy="19" r="5"/><circle cx="43" cy="19" r="5"/><circle cx="69" cy="19" r="5"/></g></g>
<g transform="translate(700 372)"><path d="M0 0h50l-6 58h-38Z" fill="#9CCBEE" opacity=".8"/><path d="M4 22h42l-3 36h-36Z" fill="#3D9BE0" opacity=".7"/></g>
<rect x="150" y="410" width="150" height="130" rx="30" fill="#B85207"/><rect x="130" y="470" width="190" height="75" rx="26" fill="#F47A1F"/></g>
<g id="layer-people" data-depth="1">
<g transform="translate(250 0)"><rect x="-44" y="340" width="88" height="180" rx="34" fill="#FFA24D"/>
<circle cx="0" cy="300" r="40" fill="#E0A87A"/><path d="M-40 292Q0 238 40 292Q16 272 -40 292Z" fill="#D8D8D8"/>
<rect x="-30" y="500" width="26" height="70" rx="8" fill="#B85207"/><rect x="4" y="500" width="26" height="70" rx="8" fill="#B85207"/>
<rect x="34" y="372" width="14" height="80" rx="7" fill="#FFA24D" transform="rotate(-70 34 372)"/></g>
