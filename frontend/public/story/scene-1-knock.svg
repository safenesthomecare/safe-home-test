<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="t1 d1">
<title id="t1">The Knock, 8:00 AM</title>
<desc id="d1">A caregiver in a blue uniform stands on a porch at sunrise as a warm light opens the front door of a cozy blue house.</desc>
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFA24D"/><stop offset=".55" stop-color="#FFD9B0"/><stop offset="1" stop-color="#FFF9F2"/></linearGradient>
<linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3D9BE0"/><stop offset="1" stop-color="#0066B3"/></linearGradient>
<radialGradient id="glow"><stop offset="0" stop-color="#FFE59A" stop-opacity=".9"/><stop offset="1" stop-color="#FFC83D" stop-opacity="0"/></radialGradient>
<style>
.door{transform-box:fill-box;transform-origin:left center;animation:open 3.5s .6s var(--e,ease-out) forwards}
.lamp{animation:pulse 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.sun{animation:rise 4s ease-out both}
@keyframes open{to{transform:scaleX(.35)}}
@keyframes pulse{50%{opacity:.55}}
@keyframes rise{from{transform:translateY(40px)}}
@media (prefers-reduced-motion:reduce){.door{animation:none;transform:scaleX(.35)}.lamp,.sun{animation:none}}
</style>
</defs>
<g id="layer-sky" data-depth="0.2"><rect width="1200" height="700" fill="url(#sky)"/>
<circle class="sun" cx="900" cy="250" r="90" fill="#FFC83D" opacity=".9"/>
<circle cx="900" cy="250" r="220" fill="url(#glow)"/></g>
<g id="layer-garden" data-depth="0.4"><path d="M0 520 Q300 470 600 510 T1200 500 V700 H0Z" fill="#4CAF3B"/>
<path d="M0 560 Q400 520 800 555 T1200 545 V700 H0Z" fill="#2E7D32"/>
<g fill="#7B4A1E"><rect x="90" y="400" width="18" height="140"/></g><circle cx="99" cy="380" r="70" fill="#4CAF3B"/><circle cx="140" cy="410" r="45" fill="#2E7D32"/></g>
<g id="layer-house" data-depth="0.6">
<rect x="330" y="260" width="540" height="300" rx="6" fill="url(#wall)"/>
<path d="M300 270 L600 120 L900 270Z" fill="#F47A1F"/><path d="M300 270 L600 120 L900 270" fill="none" stroke="#B85207" stroke-width="8" stroke-linejoin="round"/>
<rect x="380" y="280" width="120" height="80" rx="8" fill="#FFC83D"/><path d="M440 280v80M380 320h120" stroke="#003B66" stroke-width="6"/>
<rect x="700" y="300" width="120" height="110" rx="8" fill="#FFC83D"/><path d="M760 300v110M700 355h120" stroke="#003B66" stroke-width="6"/>
<rect x="540" y="350" width="120" height="210" rx="10" fill="#FFC83D" opacity=".95"/>
<g class="door"><rect x="540" y="350" width="120" height="210" rx="10" fill="#7B4A1E"/><circle cx="640" cy="460" r="6" fill="#FFC83D"/></g></g>
<g id="layer-porch" data-depth="0.8"><rect x="500" y="560" width="200" height="22" rx="6" fill="#F4E9DC"/>
<rect x="480" y="582" width="240" height="18" rx="6" fill="#E8DDD0"/>
<circle class="lamp" cx="690" cy="330" r="60" fill="url(#glow)"/><circle cx="690" cy="330" r="9" fill="#FFC83D"/></g>
<g id="layer-people" data-depth="1">
<g transform="translate(420 0)"><ellipse cx="0" cy="600" rx="55" ry="10" fill="#003B66" opacity=".2"/>
<rect x="-30" y="430" width="60" height="150" rx="26" fill="#0066B3"/>
<rect x="-28" y="575" width="22" height="30" rx="8" fill="#003B66"/><rect x="6" y="575" width="22" height="30" rx="8" fill="#003B66"/>
<circle cx="0" cy="395" r="34" fill="#C98B5B"/><path d="M-34 390 Q0 340 34 390 Q10 372 -34 390Z" fill="#232323"/>
<rect x="30" y="455" width="14" height="70" rx="7" fill="#0066B3" transform="rotate(-25 30 455)"/>
<rect x="-40" y="470" width="30" height="40" rx="8" fill="#E6F1FA"/></g></g>
<g id="layer-light" data-depth="0.3"><rect width="1200" height="700" fill="#FFA24D" opacity=".12"/></g>
</svg>
