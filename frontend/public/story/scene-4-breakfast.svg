<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="t4 d4">
<title id="t4">Breakfast Together, 10:30 AM</title>
<desc id="d4">A resident and a caregiver sit across a kitchen table sharing breakfast, with steam rising from two cups and a bowl of fruit between them.</desc>
<defs>
<linearGradient id="w4" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF9F2"/><stop offset="1" stop-color="#FDD7C5"/></linearGradient>
<style>
.steam path{fill:none;stroke:#fff;stroke-width:6;stroke-linecap:round;opacity:0;animation:rise 4s ease-out infinite}
.steam path:nth-child(2){animation-delay:-1.3s}.steam path:nth-child(3){animation-delay:-2.6s}
.glow{animation:breathe 6s ease-in-out infinite}
@keyframes rise{0%{opacity:0;transform:translateY(14px)}30%{opacity:.8}100%{opacity:0;transform:translateY(-34px)}}
@keyframes breathe{50%{opacity:.1}}
@media (prefers-reduced-motion:reduce){.steam path{animation:none;opacity:.6}.glow{animation:none}}
</style>
</defs>
<g id="layer-wall" data-depth="0.2"><rect width="1200" height="700" fill="url(#w4)"/>
<rect y="540" width="1200" height="160" fill="#F4E9DC"/><rect y="535" width="1200" height="8" fill="#E8DDD0"/>
