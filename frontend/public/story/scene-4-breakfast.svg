<rect x="300" y="420" width="600" height="26" rx="8" fill="#A9702F"/><rect x="340" y="446" width="22" height="150" fill="#7B4A1E"/><rect x="838" y="446" width="22" height="150" fill="#7B4A1E"/>
<rect x="520" y="396" width="160" height="26" rx="6" fill="#FFF9F2"/>
<path d="M530 396q70-40 140 0Z" fill="#E6F1FA"/><circle cx="570" cy="372" r="16" fill="#F47A1F"/><circle cx="605" cy="365" r="16" fill="#E53935"/><circle cx="640" cy="372" r="16" fill="#FFC83D"/>
<rect x="390" y="388" width="60" height="34" rx="8" fill="#0066B3"/><rect x="750" y="388" width="60" height="34" rx="8" fill="#F47A1F"/>
<g class="steam"><path d="M405 380q-10-22 0-44q10-22 0-44"/><path d="M420 380q-10-22 0-44"/><path d="M435 380q-10-22 0-44q10-22 0-44"/></g>
