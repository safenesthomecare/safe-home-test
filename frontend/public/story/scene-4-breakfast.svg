<circle cx="0" cy="282" r="40" fill="#E0A87A"/><path d="M-40 274Q0 220 40 274Q16 254 -40 274Z" fill="#D8D8D8"/>
<rect x="30" y="360" width="14" height="80" rx="7" fill="#FFA24D" transform="rotate(-55 30 360)"/>
<rect x="-30" y="530" width="26" height="70" rx="8" fill="#B85207"/><rect x="4" y="530" width="26" height="70" rx="8" fill="#B85207"/></g>
