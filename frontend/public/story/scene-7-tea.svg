<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="t7 d7">
<title id="t7">Tea &amp; Conversation, 4:30 PM</title>
<desc id="d7">In warm late-afternoon light a resident and a caregiver sit side by side on a sofa, sharing tea and looking through a family photo album.</desc>
<defs>
<linearGradient id="w7" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FDD7C5"/><stop offset="1" stop-color="#FFF9F2"/></linearGradient>
<radialGradient id="lg"><stop offset="0" stop-color="#FFE59A" stop-opacity=".8"/><stop offset="1" stop-color="#FFC83D" stop-opacity="0"/></radialGradient>
<style>
.steam path{fill:none;stroke:#fff;stroke-width:6;stroke-linecap:round;opacity:0;animation:rise 4s ease-out infinite}
.steam path:nth-child(2){animation-delay:-2s}
.lampglow{animation:flick 5s ease-in-out infinite}
.page{transform-box:fill-box;transform-origin:left center;animation:turn 7s ease-in-out infinite}
@keyframes rise{0%{opacity:0;transform:translateY(12px)}30%{opacity:.85}100%{opacity:0;transform:translateY(-30px)}}
@keyframes flick{50%{opacity:.6}}
@keyframes turn{0%,70%,100%{transform:scaleX(1)}85%{transform:scaleX(-.9)}}
@media (prefers-reduced-motion:reduce){.steam path{animation:none;opacity:.6}.lampglow,.page{animation:none}}
</style>
</defs>
