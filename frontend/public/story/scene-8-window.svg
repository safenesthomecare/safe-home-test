<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="t8 d8">
<title id="t8">The Lit Window, 7:30 PM</title>
<desc id="d8">At dusk the caregiver walks away down the path while the house glows with a warm golden window, safe for the night under a sky of first stars.</desc>
<defs>
<linearGradient id="s8" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#00263F"/><stop offset=".6" stop-color="#003B66"/><stop offset="1" stop-color="#7B4A1E" stop-opacity=".6"/></linearGradient>
<linearGradient id="wl8" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0066B3"/><stop offset="1" stop-color="#003B66"/></linearGradient>
<radialGradient id="gl8"><stop offset="0" stop-color="#FFE59A" stop-opacity=".9"/><stop offset=".5" stop-color="#FFC83D" stop-opacity=".3"/><stop offset="1" stop-color="#FFC83D" stop-opacity="0"/></radialGradient>
<style>
.beat{transform-box:fill-box;transform-origin:center;animation:beat 2.6s ease-in-out infinite}
.star{animation:tw 4s ease-in-out infinite}.star:nth-child(2){animation-delay:-1s}.star:nth-child(3){animation-delay:-2s}.star:nth-child(4){animation-delay:-3s}.star:nth-child(5){animation-delay:-1.5s}
.away{animation:leave 12s linear infinite}
@keyframes beat{0%,100%{transform:scale(1);opacity:.85}12%{transform:scale(1.12);opacity:1}24%{transform:scale(1);opacity:.85}36%{transform:scale(1.08);opacity:1}}
@keyframes tw{50%{opacity:.3}}
@keyframes leave{from{transform:translate(0,0) scale(1)}to{transform:translate(-230px,-20px) scale(.7)}}
@media (prefers-reduced-motion:reduce){.beat,.star{animation:none}.away{animation:none;transform:translate(-120px,-10px) scale(.85)}}
</style>
</defs>
<g id="layer-sky" data-depth="0.2"><rect width="1200" height="700" fill="url(#s8)"/>
<g fill="#FFF9F2"><circle class="star" cx="150" cy="90" r="3"/><circle class="star" cx="380" cy="150" r="2.5"/><circle class="star" cx="720" cy="70" r="3"/><circle class="star" cx="980" cy="130" r="2.5"/><circle class="star" cx="1100" cy="60" r="3"/></g>
<path d="M1030 160A40 40 0 1 0 1050 236A32 32 0 1 1 1030 160Z" fill="#FFF9F2" opacity=".9"/></g>
<g id="layer-garden" data-depth="0.4"><path d="M0 540Q300 500 600 530T1200 520V700H0Z" fill="#1F5A25"/>
<rect x="90" y="380" width="20" height="170" fill="#4A2C10"/><circle cx="100" cy="360" r="80" fill="#14421A"/></g>
<g id="layer-house" data-depth="0.6">
<rect x="520" y="300" width="500" height="260" rx="6" fill="url(#wl8)"/>
<path d="M490 310L770 160L1050 310Z" fill="#B85207"/>
<rect x="800" y="250" width="40" height="70" fill="#7B4A1E"/>
<circle class="beat" cx="620" cy="410" r="150" fill="url(#gl8)"/>
<rect x="560" y="360" width="120" height="110" rx="8" fill="#FFC83D"/><path d="M620 360v110M560 415h120" stroke="#B85207" stroke-width="6"/>
<rect x="720" y="380" width="100" height="180" rx="10" fill="#7B4A1E"/><circle cx="800" cy="470" r="5" fill="#FFC83D"/>
<rect x="880" y="360" width="100" height="90" rx="8" fill="#003B66"/>
<circle cx="700" cy="350" r="7" fill="#FFC83D"/>
<path d="M600 408q10-24 20 0q10 24 20 0" fill="none" stroke="#B85207" stroke-width="4" opacity=".0"/></g>
<g id="layer-path" data-depth="0.8"><path d="M720 560L600 700H860L790 560Z" fill="#5B4B3A"/><path d="M600 700L330 560H300L580 700Z" fill="#4A3B2C" opacity=".0"/></g>
<g id="layer-people" data-depth="1"><g class="away" transform-origin="700 620">
<g transform="translate(560 0)"><ellipse cx="0" cy="640" rx="50" ry="8" fill="#000" opacity=".3"/>
<rect x="-26" y="590" width="20" height="50" rx="8" fill="#001B2E"/><rect x="4" y="590" width="20" height="50" rx="8" fill="#001B2E"/>
<rect x="-30" y="470" width="60" height="140" rx="26" fill="#0B5A99"/><circle cx="0" cy="436" r="32" fill="#8D5A3C"/><path d="M-32 432Q0 386 32 432Q10 414 -32 432Z" fill="#111"/>
<rect x="24" y="500" width="12" height="70" rx="6" fill="#0B5A99" transform="rotate(-10 30 500)"/></g></g></g>
<g id="layer-glow" data-depth="0.9"><rect x="0" y="0" width="1200" height="700" fill="#00263F" opacity="0"/></g>
</svg>
