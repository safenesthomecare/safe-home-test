<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="t6 d6">
<title id="t6">A Walk Together, 2:00 PM</title>
<desc id="d6">A caregiver and a resident walk arm in arm along a park path under trees, with leaves drifting down in the afternoon light.</desc>
<defs>
<linearGradient id="s6" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9CCBEE"/><stop offset="1" stop-color="#E6F1FA"/></linearGradient>
<style>
.walk{animation:bob 1.2s ease-in-out infinite}
.legA{transform-box:fill-box;transform-origin:top center;animation:swA 1.2s ease-in-out infinite}
.legB{transform-box:fill-box;transform-origin:top center;animation:swB 1.2s ease-in-out infinite}
.leaf{animation:fall 9s linear infinite}
.leaf:nth-child(2){animation-delay:-3s}.leaf:nth-child(3){animation-delay:-6s}.leaf:nth-child(4){animation-delay:-1.5s}
.cloud{animation:drift 40s linear infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
@keyframes swA{50%{transform:rotate(14deg)}}
@keyframes swB{50%{transform:rotate(-14deg)}}
@keyframes fall{from{transform:translate(0,-60px) rotate(0)}to{transform:translate(-60px,640px) rotate(300deg)}}
@keyframes drift{to{transform:translateX(160px)}}
@media (prefers-reduced-motion:reduce){.walk,.legA,.legB,.leaf,.cloud{animation:none}.leaf{transform:translate(0,120px)}}
</style>
</defs>
<g id="layer-sky" data-depth="0.2"><rect width="1200" height="700" fill="url(#s6)"/>
<circle cx="1000" cy="130" r="55" fill="#FFC83D" opacity=".9"/>
<g class="cloud" fill="#fff" opacity=".9"><ellipse cx="260" cy="130" rx="90" ry="26"/><ellipse cx="320" cy="115" rx="60" ry="26"/><ellipse cx="600" cy="200" rx="80" ry="22"/><ellipse cx="650" cy="188" rx="50" ry="22"/></g></g>
<g id="layer-hills" data-depth="0.4"><path d="M0 430Q250 340 520 420T1200 400V700H0Z" fill="#8BD450"/><path d="M0 480Q300 420 640 470T1200 450V700H0Z" fill="#4CAF3B"/></g>
<g id="layer-trees" data-depth="0.6">
<rect x="120" y="260" width="24" height="230" fill="#7B4A1E"/><circle cx="132" cy="230" r="100" fill="#2E7D32"/><circle cx="190" cy="270" r="66" fill="#4CAF3B"/>
<rect x="990" y="280" width="22" height="210" fill="#7B4A1E"/><circle cx="1001" cy="250" r="90" fill="#2E7D32"/><circle cx="950" cy="290" r="60" fill="#4CAF3B"/>
<g transform="translate(240 20)"><rect x="470" y="470" width="150" height="10" rx="4" fill="#7B4A1E"/><rect x="480" y="480" width="8" height="30" fill="#7B4A1E"/><rect x="600" y="480" width="8" height="30" fill="#7B4A1E"/></g></g>
<g id="layer-path" data-depth="0.8"><path d="M0 700L420 520H820L1200 700Z" fill="#F4E9DC"/><path d="M0 700L420 520H430L40 700ZM1200 700L820 520H810L1160 700Z" fill="#E8DDD0"/></g>
<g id="layer-people" data-depth="1"><g class="walk">
<g transform="translate(500 0)"><rect class="legA" x="-26" y="500" width="22" height="90" rx="8" fill="#B85207"/><rect class="legB" x="4" y="500" width="22" height="90" rx="8" fill="#B85207"/>
<rect x="-42" y="330" width="84" height="190" rx="34" fill="#FFA24D"/><circle cx="0" cy="292" r="40" fill="#E0A87A"/><path d="M-40 284Q0 230 40 284Q16 264 -40 284Z" fill="#D8D8D8"/>
<rect x="30" y="390" width="110" height="14" rx="7" fill="#FFA24D"/></g>
<g transform="translate(700 0)"><rect class="legB" x="-26" y="515" width="22" height="90" rx="8" fill="#003B66"/><rect class="legA" x="4" y="515" width="22" height="90" rx="8" fill="#003B66"/>
<rect x="-32" y="340" width="64" height="195" rx="28" fill="#0066B3"/><circle cx="0" cy="304" r="36" fill="#C98B5B"/><path d="M-36 300Q0 250 36 300Q12 282 -36 300Z" fill="#232323"/>
<rect x="-110" y="390" width="90" height="14" rx="7" fill="#0066B3"/></g></g></g>
<g id="layer-leaves" data-depth="0.9" fill="#F47A1F"><path class="leaf" d="M300 0q14 10 0 28q-14-18 0-28Z"/><path class="leaf" d="M520 0q14 10 0 28q-14-18 0-28Z" fill="#FFC83D"/><path class="leaf" d="M820 0q14 10 0 28q-14-18 0-28Z"/><path class="leaf" d="M1020 0q14 10 0 28q-14-18 0-28Z" fill="#B85207"/></g>
</svg>
