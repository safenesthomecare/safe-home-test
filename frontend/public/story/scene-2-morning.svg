<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="t2 d2">
<title id="t2">Good Morning, 8:30 AM</title>
<desc id="d2">In a sunlit bedroom a caregiver opens the curtains while a resident sits up in bed, smiling. Golden light and floating dust fill the room.</desc>
<defs>
<linearGradient id="rw" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF9F2"/><stop offset="1" stop-color="#F4E9DC"/></linearGradient>
<linearGradient id="beam" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFE59A" stop-opacity=".7"/><stop offset="1" stop-color="#FFC83D" stop-opacity="0"/></linearGradient>
<style>
.curt{transform-box:fill-box;transform-origin:top center;animation:sway 5s ease-in-out infinite}
.dust circle{animation:float 7s ease-in-out infinite}
.dust circle:nth-child(2){animation-delay:-2s}.dust circle:nth-child(3){animation-delay:-4s}.dust circle:nth-child(4){animation-delay:-5s}
.beam{animation:breathe 6s ease-in-out infinite}
@keyframes sway{50%{transform:skewX(-2deg)}}
@keyframes float{50%{transform:translate(14px,-26px)}}
@keyframes breathe{50%{opacity:.7}}
@media (prefers-reduced-motion:reduce){.curt,.dust circle,.beam{animation:none}}
</style>
</defs>
<g id="layer-wall" data-depth="0.2"><rect width="1200" height="700" fill="url(#rw)"/>
<rect y="520" width="1200" height="180" fill="#E8DDD0"/><rect y="515" width="1200" height="8" fill="#7B4A1E" opacity=".5"/></g>
<g id="layer-window" data-depth="0.4">
<rect x="780" y="110" width="300" height="320" rx="10" fill="#FFD9B0" stroke="#F4E9DC" stroke-width="14"/>
<circle cx="960" cy="230" r="55" fill="#FFC83D"/><path d="M780 430Q900 380 1080 420V430Z" fill="#4CAF3B"/>
<path d="M930 110v320M780 270h300" stroke="#F4E9DC" stroke-width="8"/>
<path class="curt" d="M770 100h70v350q-35 12-70 0Z" fill="#F47A1F" opacity=".9"/>
<path class="curt" d="M1020 100h70v350q-35 12-70 0Z" fill="#F47A1F" opacity=".9"/></g>
<g id="layer-furniture" data-depth="0.6">
<rect x="130" y="400" width="480" height="40" rx="8" fill="#7B4A1E"/>
<rect x="130" y="330" width="22" height="240" rx="6" fill="#7B4A1E"/><rect x="590" y="430" width="20" height="140" rx="6" fill="#7B4A1E"/>
<rect x="150" y="430" width="440" height="100" rx="20" fill="#E6F1FA"/>
<rect x="150" y="430" width="440" height="40" rx="18" fill="#0066B3" opacity=".85"/>
<rect x="160" y="360" width="110" height="60" rx="26" fill="#FFF9F2"/>
<rect x="650" y="470" width="90" height="110" rx="8" fill="#7B4A1E"/><rect x="665" y="440" width="60" height="30" rx="6" fill="#FFC83D"/><path d="M695 440v-20" stroke="#7B4A1E" stroke-width="5"/>
<path d="M300 420Q420 380 480 430" fill="#003B66" opacity=".08"/></g>
<g id="layer-beam" data-depth="0.3"><path class="beam" d="M780 120L1080 430 560 640 380 560Z" fill="url(#beam)"/>
<g class="dust" fill="#FFE59A"><circle cx="700" cy="300" r="4"/><circle cx="800" cy="400" r="3"/><circle cx="620" cy="440" r="5"/><circle cx="880" cy="500" r="3"/></g></g>
<g id="layer-people" data-depth="1">
<g transform="translate(220 0)"><circle cx="0" cy="395" r="32" fill="#E0A87A"/><path d="M-32 388Q0 350 32 388Q10 372 -32 388Z" fill="#D8D8D8"/><rect x="-34" y="425" width="68" height="40" rx="18" fill="#FFC83D"/></g>
<g transform="translate(930 0)"><ellipse cx="0" cy="578" rx="55" ry="9" fill="#003B66" opacity=".2"/>
<rect x="-30" y="400" width="60" height="170" rx="26" fill="#0066B3"/>
<rect x="-28" y="565" width="22" height="30" rx="8" fill="#003B66"/><rect x="6" y="565" width="22" height="30" rx="8" fill="#003B66"/>
<circle cx="0" cy="365" r="34" fill="#8D5A3C"/><path d="M-34 360Q0 310 34 360Q10 342 -34 360Z" fill="#232323"/>
<rect x="24" y="300" width="14" height="110" rx="7" fill="#0066B3" transform="rotate(25 30 400)"/></g></g>
<g id="layer-light" data-depth="0.3"><rect width="1200" height="700" fill="#FFC83D" opacity=".08"/></g>
</svg>
