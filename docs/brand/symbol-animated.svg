</g></g><g class="L-ll"><g id="ll"><g class="leaf" style="--d:0s" transform="translate(312 350) rotate(-125) scale(0.85 0.85)"><g class="leaf-in"><path d="M0 0 C16 -34 56 -42 84 -34 C80 -4 40 22 0 0 Z" fill="url(#ll-g)"/><path d="M4 -2 C28 -14 52 -22 76 -30" stroke="#8BD450" stroke-width="3" fill="none" stroke-linecap="round" opacity=".85"/></g></g><g class="leaf" style="--d:0.12s" transform="translate(302 372) rotate(-160) scale(0.95 0.95)"><g class="leaf-in"><path d="M0 0 C16 -34 56 -42 84 -34 C80 -4 40 22 0 0 Z" fill="url(#ll-g)"/><path d="M4 -2 C28 -14 52 -22 76 -30" stroke="#8BD450" stroke-width="3" fill="none" stroke-linecap="round" opacity=".85"/></g></g><g class="leaf" style="--d:0.24s" transform="translate(312 394) rotate(172) scale(0.8 0.8)"><g class="leaf-in"><path d="M0 0 C16 -34 56 -42 84 -34 C80 -4 40 22 0 0 Z" fill="url(#ll-g)"/><path d="M4 -2 C28 -14 52 -22 76 -30" stroke="#8BD450" stroke-width="3" fill="none" stroke-linecap="round" opacity=".85"/></g></g></g></g><g class="L-lr"><g id="lr"><g class="leaf" style="--d:0s" transform="translate(712 350) rotate(-55) scale(0.85 0.85)"><g class="leaf-in"><path d="M0 0 C16 -34 56 -42 84 -34 C80 -4 40 22 0 0 Z" fill="url(#lr-g)"/><path d="M4 -2 C28 -14 52 -22 76 -30" stroke="#8BD450" stroke-width="3" fill="none" stroke-linecap="round" opacity=".85"/></g></g><g class="leaf" style="--d:0.12s" transform="translate(722 372) rotate(-20) scale(0.95 0.95)"><g class="leaf-in"><path d="M0 0 C16 -34 56 -42 84 -34 C80 -4 40 22 0 0 Z" fill="url(#lr-g)"/><path d="M4 -2 C28 -14 52 -22 76 -30" stroke="#8BD450" stroke-width="3" fill="none" stroke-linecap="round" opacity=".85"/></g></g><g class="leaf" style="--d:0.24s" transform="translate(712 394) rotate(8) scale(0.8 0.8)"><g class="leaf-in"><path d="M0 0 C16 -34 56 -42 84 -34 C80 -4 40 22 0 0 Z" fill="url(#lr-g)"/><path d="M4 -2 C28 -14 52 -22 76 -30" stroke="#8BD450" stroke-width="3" fill="none" stroke-linecap="round" opacity=".85"/></g></g></g></g><g class="L-ht"><g id="ht"><g transform="translate(512 160)"><g class="heart-in"><path d="M0 22 C-30 2 -36 -20 -20 -30 C-9 -36 0 -29 0 -22 C0 -29 9 -36 20 -30 C36 -20 30 2 0 22 Z" fill="url(#ht-g)"/></g></g></g></g></svg>
