<svg xmlns="http://www.w3.org/2000/svg" viewBox="262 104 500 400" role="img" aria-label="SafeNest symbol (animated intro, then idle)" ><title>SafeNest symbol (animated intro, then idle)</title><defs><linearGradient id="nb-g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#A9702F"/><stop offset="1" stop-color="#5A3213"/></linearGradient><linearGradient id="fb-g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3D9BE0"/><stop offset="1" stop-color="#004A82"/></linearGradient><linearGradient id="fo-g" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFA24D"/><stop offset="1" stop-color="#D9600F"/></linearGradient><linearGradient id="hs-b" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3D9BE0"/><stop offset="1" stop-color="#004A82"/></linearGradient><linearGradient id="hs-r" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFA24D"/><stop offset="1" stop-color="#D9600F"/></linearGradient><radialGradient id="gl-g"><stop offset="0" stop-color="#FFE59A" stop-opacity=".85"/><stop offset=".55" stop-color="#FFC83D" stop-opacity=".25"/><stop offset="1" stop-color="#FFC83D" stop-opacity="0"/></radialGradient><linearGradient id="nf-g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#A9702F"/><stop offset="1" stop-color="#5A3213"/></linearGradient><linearGradient id="nf-f" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8C5524"/><stop offset="1" stop-color="#5A3213"/></linearGradient><linearGradient id="ll-g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8BD450"/><stop offset="1" stop-color="#2E8B2E"/></linearGradient><linearGradient id="lr-g" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8BD450"/><stop offset="1" stop-color="#2E8B2E"/></linearGradient><linearGradient id="ht-g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFA24D"/><stop offset="1" stop-color="#D9600F"/></linearGradient></defs><style>
:root{--t0:3.6s}
.L-nb,.L-nf,.L-hs,.L-fb,.L-fo,.L-ht,.L-ll,.L-lr,.L-gl,.L-wm,.L-ds,.L-tg{transform-box:fill-box}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes rise{from{opacity:0;transform:translateY(46px)}to{opacity:1;transform:none}}
@keyframes rise-s{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
@keyframes in-l{from{opacity:0;transform:translateX(-80px) rotate(-10deg)}to{opacity:1;transform:none}}
@keyframes in-r{from{opacity:0;transform:translateX(80px) rotate(10deg)}to{opacity:1;transform:none}}
@keyframes sprout{0%{transform:scale(0) rotate(-24deg)}70%{transform:scale(1.16) rotate(4deg)}100%{transform:none}}
@keyframes pop{0%{transform:scale(0)}60%{transform:scale(1.35)}100%{transform:scale(1)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes letter{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:none}}
@keyframes grow-x{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.twig{stroke-dasharray:1;stroke-dashoffset:0;animation:draw .9s ease-out backwards}
.L-nb .twig{animation-delay:.1s}
.L-nf .twig{animation-delay:.85s}
.L-nf{animation:rise-s .8s ease-out .75s backwards}
.L-hs{animation:rise .9s cubic-bezier(.2,1.25,.4,1) .55s backwards}
.L-fb{animation:in-l 1s cubic-bezier(.2,1.25,.4,1) .95s backwards;transform-origin:80% 100%}
.L-fo{animation:in-r 1s cubic-bezier(.2,1.25,.4,1) 1.05s backwards;transform-origin:20% 100%}
.glow{animation:fade 1s ease-out 1.8s backwards}
.L-gl{opacity:1}
.leaf-in{transform-box:fill-box;transform-origin:0 66%;animation:sprout .7s ease-out backwards;animation-delay:calc(1.55s + var(--d,0s))}
.heart-in{transform-box:fill-box;transform-origin:50% 70%;animation:pop .7s cubic-bezier(.3,1.6,.5,1) 2s backwards}
.gl{animation:letter .65s cubic-bezier(.2,1.25,.4,1) backwards;animation-delay:calc(2.1s + var(--i)*.07s)}
.rule{transform-box:fill-box;animation:grow-x .8s ease-out 2.9s backwards}
.rl{transform-origin:100% 50%}.rr{transform-origin:0 50%}
.L-ds path:first-child{animation:fade .8s ease-out 2.9s backwards}
.tag{animation:fade .9s ease-out 3.2s backwards}
.swoosh{stroke-dasharray:1;animation:draw .9s ease-out 3.5s backwards}

@keyframes beat{0%,100%{transform:scale(1)}10%{transform:scale(1.2)}20%{transform:scale(1)}30%{transform:scale(1.12)}42%{transform:scale(1)}}
@keyframes flicker{0%,100%{opacity:1}50%{opacity:.55}}
@keyframes sway{0%,100%{transform:rotate(0)}50%{transform:rotate(4deg)}}
@keyframes lean-l{0%,100%{transform:rotate(0)}50%{transform:rotate(1.8deg)}}
@keyframes lean-r{0%,100%{transform:rotate(0)}50%{transform:rotate(-1.8deg)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.heart-in{animation-name:pop,beat,float;animation-duration:.7s,3.4s,3.4s;animation-delay:2s,var(--t0),var(--t0);animation-iteration-count:1,infinite,infinite;animation-fill-mode:backwards,none,none;animation-timing-function:cubic-bezier(.3,1.6,.5,1),ease-in-out,ease-in-out}
.glow{animation:fade 1s ease-out 1.8s backwards,flicker 3.6s ease-in-out var(--t0) infinite}
.leaf-in{animation:sprout .7s ease-out backwards,sway 5s ease-in-out infinite;animation-delay:calc(1.55s + var(--d,0s)),calc(var(--t0) + var(--d,0s))}
.L-fb{animation:in-l 1s cubic-bezier(.2,1.25,.4,1) .95s backwards,lean-l 6s ease-in-out var(--t0) infinite}
.L-fo{animation:in-r 1s cubic-bezier(.2,1.25,.4,1) 1.05s backwards,lean-r 6s ease-in-out var(--t0) infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><g class="L-nb"><g id="nb" fill="none" stroke-linecap="round" stroke-linejoin="round">
