</g></g><g class="L-gl"><circle id="gl" class="glow" cx="512" cy="318" r="74" fill="url(#gl-g)"/></g><g class="L-nf"><g id="nf" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <path d="M294 376 Q512 416 730 376 C722 470 642 496 512 496 C382 496 302 470 294 376 Z" fill="url(#nf-f)" stroke="none"/>
  <path class="twig" pathLength="1" d="M298 388 C392 444 632 444 726 388" stroke="url(#nf-g)" stroke-width="15"/>
  <path class="twig" pathLength="1" d="M308 414 C402 466 622 466 716 414" stroke="#A9702F" stroke-width="12"/>
