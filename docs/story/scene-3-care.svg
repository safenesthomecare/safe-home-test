<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="t3 d3">
<title id="t3">Personal Care, 9:15 AM</title>
<desc id="d3">A resident sits at a dresser mirror while a caregiver gently helps them into a warm cardigan. The scene is calm and dignified, with soft morning light.</desc>
<defs>
<linearGradient id="w3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E6F1FA"/><stop offset="1" stop-color="#FFF9F2"/></linearGradient>
<linearGradient id="mir" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E6F1FA"/><stop offset="1" stop-color="#9CCBEE"/></linearGradient>
<linearGradient id="shine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".7"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<clipPath id="mc"><rect x="400" y="130" width="260" height="320" rx="130"/></clipPath>
<style>
.shine{animation:sweep 6s ease-in-out infinite}
.towel{transform-box:fill-box;transform-origin:top center;animation:hang 5s ease-in-out infinite}
.glow{animation:breathe 6s ease-in-out infinite}
@keyframes sweep{0%{transform:translateX(-300px)}60%,100%{transform:translateX(300px)}}
@keyframes hang{50%{transform:skewX(-3deg)}}
@keyframes breathe{50%{opacity:.1}}
@media (prefers-reduced-motion:reduce){.shine,.towel,.glow{animation:none}.shine{transform:translateX(0);opacity:0}}
</style>
</defs>
<g id="layer-wall" data-depth="0.2"><rect width="1200" height="700" fill="url(#w3)"/>
<rect y="540" width="1200" height="160" fill="#F4E9DC"/><rect y="535" width="1200" height="8" fill="#E8DDD0"/>
<g fill="#E8DDD0" opacity=".6"><rect x="0" y="260" width="1200" height="2"/><rect x="0" y="360" width="1200" height="2"/></g></g>
<g id="layer-window" data-depth="0.4"><rect x="900" y="120" width="200" height="240" rx="10" fill="#FFD9B0" stroke="#FFF9F2" stroke-width="12"/>
<path d="M1000 120v240M900 240h200" stroke="#FFF9F2" stroke-width="6"/><circle cx="1050" cy="190" r="30" fill="#FFC83D"/></g>
<g id="layer-furniture" data-depth="0.6">
<rect x="360" y="440" width="340" height="30" rx="8" fill="#7B4A1E"/><rect x="380" y="470" width="300" height="100" rx="6" fill="#A9702F"/>
<rect x="395" y="485" width="130" height="70" rx="6" fill="#7B4A1E" opacity=".35"/><rect x="535" y="485" width="130" height="70" rx="6" fill="#7B4A1E" opacity=".35"/>
<rect x="390" y="120" width="280" height="340" rx="140" fill="#F47A1F"/>
<rect x="400" y="130" width="260" height="320" rx="130" fill="url(#mir)"/>
<g clip-path="url(#mc)"><rect class="shine" x="400" y="130" width="90" height="320" fill="url(#shine)" transform="skewX(-12)"/></g>
<rect x="420" y="415" width="40" height="25" rx="6" fill="#FFC83D"/><rect x="600" y="410" width="30" height="30" rx="15" fill="#4CAF3B"/>
<rect x="770" y="500" width="80" height="8" rx="4" fill="#7B4A1E"/><path class="towel" d="M790 508h40v90q-20 10-40 0Z" fill="#FFC83D"/></g>
<g id="layer-people" data-depth="1">
<g transform="translate(530 0)"><rect x="-50" y="505" width="100" height="75" rx="12" fill="#B85207"/>
<rect x="-44" y="330" width="88" height="190" rx="36" fill="#FFA24D"/>
<circle cx="0" cy="290" r="42" fill="#E0A87A"/><path d="M-42 282Q0 225 42 282Q16 260 -42 282Z" fill="#D8D8D8"/>
<rect x="-44" y="400" width="88" height="20" fill="#F47A1F" opacity=".5"/></g>
<g transform="translate(680 0)"><ellipse cx="0" cy="598" rx="55" ry="9" fill="#003B66" opacity=".2"/>
<rect x="-30" y="410" width="60" height="180" rx="26" fill="#0066B3"/>
<rect x="-28" y="585" width="22" height="30" rx="8" fill="#003B66"/><rect x="6" y="585" width="22" height="30" rx="8" fill="#003B66"/>
<circle cx="0" cy="375" r="34" fill="#C98B5B"/><path d="M-34 370Q0 320 34 370Q10 352 -34 370Z" fill="#232323"/>
<rect x="-80" y="440" width="14" height="80" rx="7" fill="#0066B3" transform="rotate(55 -30 450)"/></g></g>
<g id="layer-light" data-depth="0.3"><rect class="glow" width="1200" height="700" fill="#FFC83D" opacity=".03"/></g>
</svg>
